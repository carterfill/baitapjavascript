<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài 4 - Đổi màu nền trang web</title>
</head>
<body>
    <h3>Bài 4: Nhấn nút để đổi màu nền của trang web</h3>

    <input type="button" value="Xanh"
           onclick="document.body.style.backgroundColor = 'blue'">

    <input type="button" value="Đỏ"
           onclick="document.body.style.backgroundColor = 'red'">
</body>
</html>
