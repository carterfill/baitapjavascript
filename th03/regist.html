<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thông tin sinh viên</title>
</head>
<body>
    <h1>NHẬP THÔNG TIN SINH VIÊN</h1>
    <form action="https://www.google.com" method="post">
        HỌ VÀ TÊN:
        <input type="text" name="hoten" size="25">
        <br><br>
        MÃ SỐ SINH VIÊN :
        <input type="text" name="mssv" size="25">
        <br><br>
        NGÀY SINH:
        <input type="date" name="ngaysinh">
        <br><br>
        CHUYÊN NGÀNH:
        <input type="radio" name="chuyennganh" value="CNPM"> CNPM
        <input type="radio" name="chuyennganh" value="HTTT"> HTTT
        <input type="radio" name="chuyennganh" value="AN NINH MANG"> AN NINH MANG
        <br><br>
        SỞ THÍCH:<br>
        <input type="checkbox" name="sothich" value="VIẾT CHƯƠNG TRÌNH"> VIẾT CHƯƠNG TRÌNH<br>
        <input type="checkbox" name="sothich" value="PHÂN TÍCH CSDL"> PHÂN TÍCH CSDL<br>
        <input type="checkbox" name="sothich" value="XÂY DỰNG SƠ ĐỒ MẠNG"> XÂY DỰNG SƠ ĐỒ MẠNG
        <br><br>
        MÀU SẮC YÊU THÍCH:
        <input type="color" name="mausac" value="#000000">
        <br><br>
        HÌNH ĐẠI DIỆN:
        <input type="file" name="hinhdaidien">
        <br><br>
        TÊN ĐĂNG NHẬP WEB TRƯỜNG:
        <input type="text" name="tendangnhap" size="20">
        <br><br>
        MẬT KHẨU ĐĂNG NHẬP WEB TRƯỜNG:
        <input type="password" name="matkhau" size="20">
        <br><br>
        <input type="submit" value="Gửi dữ liệu về máy chủ">
    </form>
</body>
</html>
