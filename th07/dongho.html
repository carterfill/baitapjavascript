<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đồng hồ kỹ thuật số</title>
    <style>
        body {
            background: black;
            text-align: center;
            padding-top: 120px;
        }
        #dongHo {
            font-family: 'Times New Roman', serif;
            font-size: 90px;
            color: #00e5ff;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <h1 id="dongHo">00:00:00 AM</h1>

    <script>
        function CapNhatDongHo() {
            var d = new Date();

            var gio = d.getHours();
            var buoi = (gio >= 12) ? "PM" : "AM";
            gio = gio % 12;
            if (gio == 0) gio = 12;

            var phut = d.getMinutes();
            var giay = d.getSeconds();

            if (gio < 10) gio = "0" + gio;
            if (phut < 10) phut = "0" + phut;
            if (giay < 10) giay = "0" + giay;

            document.getElementById('dongHo').innerText =
                gio + ":" + phut + ":" + giay + " " + buoi;
        }

        setInterval(CapNhatDongHo, 1000);
        CapNhatDongHo();
    </script>
</body>
</html>
